[package]
name = "paintcode"
description = "A small dab engine. Every brush mark is a row of anisotropic 2D Gaussians."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# cargo bench runs benches/ only, not the unit tests in bench mode
[lib]
bench = false

[dependencies]
png.workspace = true
rayon.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
rayon.workspace = true
flate2.workspace = true
criterion.workspace = true

[[bench]]
name = "paint"
harness = false

[features]
# time every stage of a paint; see src/profile.rs and benches/stages.rs
profile = []

[[bench]]
name = "stages"
harness = false
required-features = ["profile"]
