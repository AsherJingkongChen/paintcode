[package]
name = "paintcode"
description = "A small dab engine. Every brush mark is a row of anisotropic 2D Gaussians."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# rlib for the tests and benches, cdylib for maturin to load as paintcode._core
crate-type = ["cdylib", "rlib"]
# cargo bench runs benches/ only, not the unit tests in bench mode
bench = false

[dependencies]
png.workspace = true
rayon.workspace = true
serde_json.workspace = true
thiserror.workspace = true
pyo3 = { version = "0.30", features = ["abi3-py310"], optional = true }

[dev-dependencies]
rayon.workspace = true
flate2.workspace = true
criterion.workspace = true

[[bench]]
name = "paint"
harness = false

[features]
# time every stage of a paint; see src/profile.rs and benches/stages.rs
profile = []
# the Python module paintcode._core (src/python.rs); maturin turns it on, see pyproject.toml
python = ["dep:pyo3"]

[[bench]]
name = "stages"
harness = false
required-features = ["profile"]
