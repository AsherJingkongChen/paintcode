[workspace]
resolver = "3"
members = ["crates/paintcode"]

[workspace.package]
version = "0.11.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/AsherJingkongChen/paintcode"

# opt-level "s" renders as fast as 3 and is 38% smaller (measured in the commit that set it).
# panic must stay "unwind": PyO3 turns panics into Python exceptions; "abort" kills Python.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
strip = "symbols"
