name: ci

on:
  push:
  pull_request:

# Each job runs a recipe of the justfile, the same one run before a commit.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # setup-uv tags only full versions; there is no moving v10
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59
      - name: The pinned nightly from rust-toolchain.toml
        run: rustup toolchain install
      # target/ and the registry, keyed by the toolchain and Cargo.lock
      - uses: Swatinem/rust-cache@v2
      - name: The engine and the Python module
        run: just test
      - name: The type stub and the README, from the binding
        run: just stub
      - name: What they wrote (golden snapshots, stub, README) is what is committed
        run: git diff --exit-code --stat

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.59
      - name: The pinned nightly from rust-toolchain.toml
        run: rustup toolchain install
      # target/ and the registry, keyed by the toolchain and Cargo.lock
      - uses: Swatinem/rust-cache@v2
      - name: Formatting, and clippy with the python feature and the benches
        run: just check
