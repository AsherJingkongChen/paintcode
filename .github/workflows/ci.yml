name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # setup-uv tags only full versions; there is no moving v10
      - uses: astral-sh/setup-uv@v10.3.3
      - name: The pinned nightly from rust-toolchain.toml
        run: rustup toolchain install
      # target/ and the registry, keyed by the toolchain and Cargo.lock
      - uses: Swatinem/rust-cache@v2
      - name: Engine tests (behaviour, golden snapshots, fast path = reference path, layering)
        run: cargo test --release -p paintcode -- --include-ignored
      - name: The golden snapshots it wrote are the ones committed
        run: git diff --exit-code --stat -- tests/golden
      - name: The engine built as a Python module (from uv.lock)
        run: uv sync --locked
      - name: Python tests (arguments, bytes, errors)
        run: uv run pytest -q
      - name: The type stub and the README are the ones src/bin/stub_gen.rs writes from the binding
        run: |
          uv run cargo run --bin stub_gen --features python
          git diff --exit-code -- README.md python/paintcode/_core.pyi

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The pinned nightly from rust-toolchain.toml
        run: rustup toolchain install
      # target/ and the registry, keyed by the toolchain and Cargo.lock
      - uses: Swatinem/rust-cache@v2
      - name: Everything builds, the python feature and the benches included
        run: cargo check --workspace --all-targets --all-features
      - name: Clippy, warnings as errors; no unwrap, panic, todo or unimplemented outside tests
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
